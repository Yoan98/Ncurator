appId: com.yoan.ncurator
productName: Ncurator
artifactName: ${productName}-${os}-${arch}.${ext}
directories:
  app: release-stage/app
  buildResources: build
files:
  - 'out/**/*'
  - 'package.json'
  - '!**/*.map'
  - '!**/*.{ts,tsx,mts,cts,py,pyc,pyo,c,cc,cpp,h,hpp,pdb}'
  - '!**/{test,tests,__tests__,doc,docs,example,examples,benchmark,benchmarks,scripts}/**/*'
extraResources:
  - from: release-stage/app/resources/web_crawler_sidecar/bin
    to: web_crawler_sidecar/bin
    filter:
      - '**/*'
  - from: release-stage/app/resources/native
    to: native
    filter:
      - '**/*'
  - from: build/app-update.yml
    to: app-update.yml
asarUnpack:
  - '**/node_modules/onnxruntime-node/bin/napi-v3/**/*'
  - '**/node_modules/node-pty/build/Release/**/*'
  - '**/node_modules/@napi-rs/canvas/**/*'
  - '**/node_modules/@napi-rs/canvas-*/**/*'
win:
  icon: build/icon.ico
  executableName: Ncurator
  target:
    - target: nsis
      arch:
        - x64
nsis:
  artifactName: ${productName}-windows-${arch}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  icon: build/icon.icns
  artifactName: ${productName}-mac-${arch}.${ext}
  # @electron/osx-sign 会把部分二进制格式的数据文件误判成可执行文件。
  # 这些资源由外层 bundle 签名保护；Mach-O、.node、.dylib 和 .so 不在忽略范围内。
  signIgnore:
    - '\.(?:asar|bin|dat|icns|nib|pak|png|ttf|zip)$'
    - '/\.jekyll-metadata$'
  # 当前使用项目自建的更新签名证书，不使用 Apple 时间戳服务。
  timestamp: none
  target:
    - dmg
    - zip
  # 自建证书没有 Apple Team ID。顶层进程和子进程都必须关闭 library validation，
  # 否则 dyld 会拒绝加载已经签名的 Electron Framework。
  entitlements: build/entitlements.mac.inherit.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${productName}-mac-${arch}.${ext}
linux:
  icon: build/icon.png
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: generic
  url: https://download.ncurator.com/updates/latest
