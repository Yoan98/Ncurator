name: Terminal Compatibility

on:
  pull_request:
    paths:
      - 'src/main/services/ai/human/tools/terminal/**'
      - 'tests/case/unit/ai/terminal-*.test.ts'
      - 'scripts/prepare-node-pty-native.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/terminal-compatibility.yml'
  push:
    branches:
      - main
    paths:
      - 'src/main/services/ai/human/tools/terminal/**'
      - 'tests/case/unit/ai/terminal-*.test.ts'
      - 'scripts/prepare-node-pty-native.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/terminal-compatibility.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terminal:
    name: ${{ matrix.os }} terminal
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:terminal
