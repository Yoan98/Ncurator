name: Build Windows Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v0.1.3'
        required: true
      package_e2e:
        description: 'Run package E2E against the built release candidate before publishing'
        required: false
        default: false
        type: boolean

concurrency:
  group: windows-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest
    environment: ncuratore
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Use HTTPS for GitHub dependencies
        shell: bash
        run: |
          git config --global url."https://github.com/".insteadOf git@github.com:

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build, optionally test, and publish the Windows release candidate
        shell: bash
        run: |
          set -euo pipefail
          args=(--tag "${{ inputs.tag }}" --local-only)
          if [ "${{ inputs.package_e2e }}" = "true" ]; then
            args+=(--package-e2e)
          fi
          node scripts/release/windows.mjs "${args[@]}"

      - name: Release summary
        shell: bash
        run: |
          echo "Windows ${{ inputs.tag }} published independently to Cloudflare R2." >> "$GITHUB_STEP_SUMMARY"
          echo "Package E2E requested: ${{ inputs.package_e2e }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Fixed download: https://download.ncurator.com/downloads/latest/windows-x64.exe" >> "$GITHUB_STEP_SUMMARY"
