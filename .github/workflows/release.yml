name: Build Windows Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v0.1.3'
        required: true

jobs:
  build-windows:
    runs-on: windows-latest
    environment: ncuratore
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Use HTTPS for GitHub dependencies
        shell: bash
        run: |
          git config --global url."https://github.com/".insteadOf git@github.com:

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate release tag and R2 configuration
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="$GITHUB_REF_NAME"
          fi
          package_version="$(node -p "require('./package.json').version")"
          test "$tag" = "v$package_version"
          test "$(git cat-file -t "$tag")" = "tag"
          test -n "$AWS_ACCESS_KEY_ID"
          test -n "$AWS_SECRET_ACCESS_KEY"
          test -n "$R2_ACCOUNT_ID"
          test -n "$R2_BUCKET_NAME"
          test "${R2_PUBLIC_BASE_URL%/}" = "https://download.ncurator.com"
          aws --version
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"

      - run: pnpm install --frozen-lockfile
      - name: Build and security-audit Windows package
        run: pnpm run build:win

      - name: Add package audit to workflow summary
        shell: bash
        run: node scripts/print-package-audit-summary.mjs dist/package-audit.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Windows release directly to Cloudflare R2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-status
          node scripts/create-release-fragment.mjs \
            dist \
            release-status/windows-x64.json \
            "$RELEASE_TAG" \
            windows-x64
          node scripts/upload-r2-release-fragment.mjs \
            dist \
            release-status/windows-x64.json

      - name: Release summary
        shell: bash
        run: |
          echo "Windows $RELEASE_TAG uploaded to Cloudflare R2." >> "$GITHUB_STEP_SUMMARY"
          echo "The local macOS release command will publish latest metadata after both Mac builds are ready." >> "$GITHUB_STEP_SUMMARY"
