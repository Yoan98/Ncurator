name: Release Desktop

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v0.1.0'
        required: true

jobs:
  build-macos-x64:
    runs-on: macos-13
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Verify macOS runner architecture
        shell: bash
        run: |
          test "$(uname -m)" = "x86_64"

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:mac:x64

      - uses: actions/upload-artifact@v4
        with:
          name: macos-x64-artifacts
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.yml
            dist/*.blockmap
          if-no-files-found: error

  build-macos-arm64:
    runs-on: macos-14
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Verify macOS runner architecture
        shell: bash
        run: |
          test "$(uname -m)" = "arm64"

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:mac:arm64

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-artifacts
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.yml
            dist/*.blockmap
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:win

      - uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            dist/*.exe
            dist/*.yml
            dist/*.blockmap
          if-no-files-found: error

  publish-release:
    runs-on: ubuntu-latest
    needs:
      - build-macos-x64
      - build-macos-arm64
      - build-windows
    env:
      GH_TOKEN: ${{ secrets.NCURATOR_RELEASE_TOKEN }}
      RELEASE_REPOSITORY: Yoan98/Ncurator
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Merge macOS update metadata
        run: node scripts/merge-latest-mac-yml.mjs release-artifacts

      - name: Resolve release tag
        id: release-tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release assets
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.release-tag.outputs.tag }}"
          if ! gh release view "$tag" --repo "$RELEASE_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" \
              --repo "$RELEASE_REPOSITORY" \
              --title "$tag" \
              --notes "Ncurator $tag"
          fi
          find release-artifacts -type f -print0 | xargs -0 gh release upload "$tag" --repo "$RELEASE_REPOSITORY" --clobber
