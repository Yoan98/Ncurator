name: Release Desktop

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v0.1.0'
        required: true

jobs:
  validate-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate release version
        id: release
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          if [ "$tag" != "v$package_version" ]; then
            echo "Release tag $tag does not match package.json version v$package_version" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build-macos-x64:
    needs: validate-release
    runs-on: macos-15-intel
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Verify macOS runner architecture
        shell: bash
        run: |
          test "$(uname -m)" = "x86_64"

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:mac:x64

      - uses: actions/upload-artifact@v4
        with:
          name: macos-x64-artifacts
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.yml
            dist/*.blockmap
          if-no-files-found: error

  build-macos-arm64:
    needs: validate-release
    runs-on: macos-15
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Verify macOS runner architecture
        shell: bash
        run: |
          test "$(uname -m)" = "arm64"

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:mac:arm64

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-artifacts
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.yml
            dist/*.blockmap
          if-no-files-found: error

  build-windows:
    needs: validate-release
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:win

      - uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            dist/*.exe
            dist/*.yml
            dist/*.blockmap
          if-no-files-found: error

  publish-release:
    runs-on: ubuntu-latest
    needs:
      - validate-release
      - build-macos-x64
      - build-macos-arm64
      - build-windows
    env:
      GH_TOKEN: ${{ secrets.NCURATOR_RELEASE_TOKEN }}
      RELEASE_REPOSITORY: Yoan98/Ncurator
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Merge macOS update metadata
        run: node scripts/merge-latest-mac-yml.mjs release-artifacts

      - name: Publish release assets
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.validate-release.outputs.tag }}"
          test -f release-artifacts/macos-arm64-artifacts/Ncurator-mac-arm64.dmg
          test -f release-artifacts/macos-x64-artifacts/Ncurator-mac-x64.dmg
          test -f release-artifacts/windows-artifacts/Ncurator-windows-x64.exe
          if ! gh release view "$tag" --repo "$RELEASE_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" \
              --repo "$RELEASE_REPOSITORY" \
              --title "$tag" \
              --notes "Ncurator $tag"
          fi
          find release-artifacts -type f -print0 | xargs -0 gh release upload "$tag" --repo "$RELEASE_REPOSITORY" --clobber
