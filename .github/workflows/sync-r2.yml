name: Sync Release to Cloudflare R2

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'GitHub Release tag to sync, for example v0.1.0'
        required: true
        default: 'v0.1.0'

jobs:
  sync-release:
    runs-on: ubuntu-latest
    environment: ncuratore
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
    steps:
      - name: Validate R2 configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AWS_ACCESS_KEY_ID"
          test -n "$AWS_SECRET_ACCESS_KEY"
          test -n "$R2_ACCOUNT_ID"
          test -n "$R2_BUCKET_NAME"
          test -n "$R2_PUBLIC_BASE_URL"

      - name: Download installers from GitHub Release
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          for asset in \
            Ncurator-mac-arm64.dmg \
            Ncurator-mac-x64.dmg \
            Ncurator-windows-x64.exe
          do
            curl --fail --location --retry 3 \
              --output "release-assets/$asset" \
              "https://github.com/Yoan98/Ncurator/releases/download/$RELEASE_TAG/$asset"
          done
          ls -lh release-assets

      - name: Upload installers to R2
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          for asset in \
            Ncurator-mac-arm64.dmg \
            Ncurator-mac-x64.dmg \
            Ncurator-windows-x64.exe
          do
            aws s3 cp "release-assets/$asset" \
              "s3://${R2_BUCKET_NAME}/releases/latest/$asset" \
              --endpoint-url "$endpoint" \
              --region auto \
              --content-type application/octet-stream \
              --content-disposition "attachment; filename=$asset" \
              --cache-control 'public, max-age=300' \
              --no-progress
          done

      - name: Verify public download URLs
        shell: bash
        run: |
          set -euo pipefail
          base_url="${R2_PUBLIC_BASE_URL%/}"
          for asset in \
            Ncurator-mac-arm64.dmg \
            Ncurator-mac-x64.dmg \
            Ncurator-windows-x64.exe
          do
            expected_size="$(stat -c '%s' "release-assets/$asset")"
            headers="$(curl --fail --silent --show-error --location --head \
              "$base_url/releases/latest/$asset")"
            actual_size="$(printf '%s\n' "$headers" | tr -d '\r' | awk 'tolower($1)=="content-length:" {value=$2} END {print value}')"
            test "$actual_size" = "$expected_size"
            printf '%s %s bytes verified\n' "$asset" "$actual_size"
          done
