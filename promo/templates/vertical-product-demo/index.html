<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>馆长竖屏视频模板</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: 'PingFang SC';
        src: local('PingFang SC');
      }

      @font-face {
        font-family: 'Microsoft YaHei';
        src: local('Microsoft YaHei');
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 1080px;
        height: 1920px;
        margin: 0;
        overflow: hidden;
        background: #ffffff;
        color: #37352f;
        font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
      }

      #root,
      .scene {
        width: 100%;
        height: 100%;
      }

      #root {
        position: relative;
        overflow: hidden;
        background: #ffffff;
      }

      .scene {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 32px;
        padding: 160px 200px 340px 80px;
        overflow: hidden;
      }

      #scene-one {
        z-index: 1;
        background: #fbfbfa;
      }

      #scene-two {
        z-index: 2;
        background: #ffffff;
        opacity: 0;
      }

      #scene-three {
        z-index: 3;
        background: #edf6ef;
        opacity: 0;
      }

      .eyebrow {
        display: flex;
        align-items: center;
        gap: 16px;
        margin: 0;
        color: #0b6bcb;
        font-size: 30px;
        font-weight: 600;
      }

      .eyebrow::before {
        width: 32px;
        height: 6px;
        border-radius: 3px;
        background: #0b6bcb;
        content: '';
      }

      h1,
      h2 {
        max-width: 720px;
        margin: 0;
        letter-spacing: 0;
      }

      h1 {
        font-size: 108px;
        font-weight: 700;
        line-height: 1.08;
      }

      h2 {
        font-size: 76px;
        font-weight: 650;
        line-height: 1.15;
      }

      .description {
        max-width: 720px;
        margin: 0;
        color: #787774;
        font-size: 38px;
        line-height: 1.5;
      }

      .demo-window {
        width: 100%;
        min-height: 620px;
        margin-top: 36px;
        overflow: hidden;
        border: 2px solid #e0dfdc;
        border-radius: 8px;
        background: #ffffff;
        box-shadow: 0 16px 40px rgba(15, 15, 15, 0.12);
      }

      .demo-toolbar {
        display: flex;
        align-items: center;
        gap: 12px;
        height: 58px;
        padding: 0 24px;
        border-bottom: 1px solid #eeeeec;
        background: #fbfbfa;
      }

      .demo-toolbar span {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #e0dfdc;
      }

      .demo-content {
        display: flex;
        height: 560px;
      }

      .demo-sidebar {
        width: 150px;
        border-right: 1px solid #eeeeec;
        background: #fbfbfa;
      }

      .demo-lines {
        display: flex;
        flex: 1;
        flex-direction: column;
        gap: 28px;
        padding: 56px 48px;
      }

      .demo-line {
        height: 18px;
        border-radius: 6px;
        background: #eeeeec;
      }

      .demo-line.accent {
        width: 68%;
        background: #0b6bcb;
      }

      .demo-line.short {
        width: 52%;
      }

      .result-mark {
        width: 72px;
        height: 72px;
        border-radius: 50%;
        background: #2f6f4e;
        color: #ffffff;
        font-size: 44px;
        line-height: 72px;
        text-align: center;
      }

      .caption {
        position: absolute;
        right: 200px;
        bottom: 360px;
        left: 80px;
        z-index: 20;
        margin: 0;
        color: #37352f;
        font-size: 50px;
        font-weight: 650;
        line-height: 1.35;
        text-align: center;
        text-shadow: 0 2px 10px rgba(255, 255, 255, 0.9);
      }

      .transition-cover {
        position: absolute;
        inset: 0;
        z-index: 50;
        background: #37352f;
        transform: translateX(-100%);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="10"
      data-width="1080"
      data-height="1920"
    >
      <section id="scene-one" class="scene" data-layout-allow-occlusion>
        <p class="eyebrow">馆长</p>
        <h1>把问题交给馆长</h1>
        <p class="description">这里放本期视频的真实问题和开场画面。</p>
      </section>

      <section id="scene-two" class="scene" data-layout-allow-occlusion>
        <p class="eyebrow">真实操作</p>
        <h2>展示解决问题的过程</h2>
        <div class="demo-window" data-layout-ignore>
          <div class="demo-toolbar"><span></span><span></span><span></span></div>
          <div class="demo-content">
            <div class="demo-sidebar"></div>
            <div class="demo-lines">
              <div class="demo-line accent"></div>
              <div class="demo-line"></div>
              <div class="demo-line short"></div>
              <div class="demo-line"></div>
            </div>
          </div>
        </div>
      </section>

      <section id="scene-three" class="scene" data-layout-allow-occlusion>
        <div class="result-mark">✓</div>
        <h2>停在有价值的结果上</h2>
        <p class="description">用真实结果结束这一期。</p>
      </section>

      <p id="caption" class="caption" data-layout-allow-occlusion>旁白字幕会显示在安全区域</p>
      <div
        id="transition-cover"
        class="transition-cover"
        data-layout-ignore
        data-layout-allow-occlusion
      ></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {}
      const tl = gsap.timeline({ paused: true })

      tl.from('#scene-one .eyebrow', { y: 32, opacity: 0, duration: 0.5, ease: 'power2.out' }, 0.2)
      tl.from('#scene-one h1', { y: 64, opacity: 0, duration: 0.7, ease: 'power3.out' }, 0.35)
      tl.from(
        '#scene-one .description',
        { x: -32, opacity: 0, duration: 0.55, ease: 'expo.out' },
        0.65
      )

      tl.fromTo(
        '#transition-cover',
        { xPercent: -100 },
        { xPercent: 0, duration: 0.38, ease: 'power3.in' },
        2.62
      )
      tl.set('#scene-one', { opacity: 0 }, 3)
      tl.set('#scene-two', { opacity: 1 }, 3)
      tl.to('#transition-cover', { xPercent: 100, duration: 0.38, ease: 'power3.out' }, 3)

      tl.from('#scene-two .eyebrow', { x: -40, opacity: 0, duration: 0.5, ease: 'expo.out' }, 3.1)
      tl.from('#scene-two h2', { y: 52, opacity: 0, duration: 0.65, ease: 'power3.out' }, 3.22)
      tl.from(
        '#scene-two .demo-window',
        { scale: 0.96, opacity: 0, duration: 0.7, ease: 'back.out(1.2)' },
        3.42
      )

      tl.fromTo(
        '#transition-cover',
        { xPercent: -100 },
        { xPercent: 0, duration: 0.38, ease: 'power3.in' },
        6.62
      )
      tl.set('#scene-two', { opacity: 0 }, 7)
      tl.set('#scene-three', { opacity: 1 }, 7)
      tl.to('#transition-cover', { xPercent: 100, duration: 0.38, ease: 'power3.out' }, 7)

      tl.from(
        '#scene-three .result-mark',
        { scale: 0.65, opacity: 0, duration: 0.5, ease: 'back.out(1.8)' },
        7.1
      )
      tl.from('#scene-three h2', { y: 48, opacity: 0, duration: 0.65, ease: 'power3.out' }, 7.25)
      tl.from(
        '#scene-three .description',
        { x: -32, opacity: 0, duration: 0.55, ease: 'expo.out' },
        7.5
      )

      tl.from('#caption', { y: 36, opacity: 0, duration: 0.45, ease: 'power2.out' }, 0.35)
      tl.to('#caption', { opacity: 0, duration: 0.35, ease: 'power2.in' }, 9.55)
      tl.to('#scene-three', { opacity: 0, duration: 0.35, ease: 'power2.in' }, 9.6)

      window.__timelines.main = tl
    </script>
  </body>
</html>
