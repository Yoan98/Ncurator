<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>馆长</title>
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' ncurator-editor://superdoc; worker-src 'self' blob: ncurator-editor://superdoc; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: http: https:; font-src 'self' data: blob:; connect-src 'self' blob: data: https: ncurator-preview:; media-src 'self' blob: https: ncurator-preview:; frame-src 'self' blob: ncurator-preview:;"
    />
    <style>
      /* 启动加载画面：内联在 HTML 里，首帧即可见，不依赖 React 挂载。
         动效与过程层黑球同源：主体呼吸 + 一圈灰环涨开淡出。 */
      #nc-boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        /* 跟随主进程写入的 data-theme；未写入时回落到系统偏好，避免冷启动闪白。 */
        background: #fbfbfa;
        pointer-events: none;
        opacity: 1;
        transition: opacity 220ms ease;
      }
      @media (prefers-color-scheme: dark) {
        #nc-boot-splash {
          background: #202020;
        }
      }
      html[data-theme='dark'] #nc-boot-splash {
        background: #202020;
      }
      html[data-theme='light'] #nc-boot-splash {
        background: #fbfbfa;
      }
      :root {
        color-scheme: light dark;
      }
      #nc-boot-splash.nc-boot-leaving {
        opacity: 0;
      }
      .nc-boot-mark {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 96px;
        height: 96px;
      }
      .nc-boot-mark svg {
        position: relative;
        z-index: 2;
        display: block;
        width: 100%;
        height: 100%;
        animation: nc-boot-breathe 1.8s ease-in-out infinite;
      }
      .nc-boot-halo {
        position: absolute;
        z-index: 1;
        width: 100%;
        height: 100%;
        border: 1.5px solid rgba(12, 14, 11, 0.34);
        border-radius: 50%;
        animation: nc-boot-halo 1.8s ease-out infinite;
      }
      @keyframes nc-boot-breathe {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.035); }
      }
      @keyframes nc-boot-halo {
        0% { transform: scale(0.7); opacity: 0; }
        28% { opacity: 0.6; }
        100% { transform: scale(1.62); opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .nc-boot-mark svg { animation: none; }
        .nc-boot-halo { animation: none; opacity: 0.35; }
      }
    </style>
  </head>

  <body>
    <div id="nc-boot-splash" role="status" aria-label="正在启动">
      <div class="nc-boot-mark">
        <span class="nc-boot-halo"></span>
        <svg viewBox="0 0 1024 1024" aria-hidden="true">
          <defs>
    <linearGradient id="nc-boot-badge" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#23261f"/>
      <stop offset="1" stop-color="#0c0e0b"/>
    </linearGradient>
  </defs>
  <circle cx="512" cy="548" r="368" fill="url(#nc-boot-badge)"/>
  <path d="M304 418 C374 306 650 306 720 418 L690 544 C604 590 420 590 334 544 Z" fill="#f2e7d0"/>
  <ellipse cx="498" cy="580" rx="344" ry="84" fill="#f2e7d0" transform="rotate(-4 498 580)"/>
  <path d="M360 690 C400 850 624 850 664 690" fill="none" stroke="#f2e7d0" stroke-width="66" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M284 906 C400 772 624 772 740 906" fill="none" stroke="#f2e7d0" stroke-width="70" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M418 852 C462 814 494 830 512 872 C530 830 562 814 606 852 C572 908 452 908 418 852 Z" fill="#a77b4b"/>
  <circle cx="720" cy="284" r="22" fill="#a77b4b"/>
  <circle cx="790" cy="230" r="16" fill="#727865"/>
        </svg>
      </div>
    </div>
    <div id="root"></div>
    <script id="vditorIconScript" src="/vditor/dist/js/icons/ant.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
