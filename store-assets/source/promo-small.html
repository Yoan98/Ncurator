<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>馆长: AI助手 - 小宣传图</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 440px; height: 280px; margin: 0; overflow: hidden; }
      body {
        display: flex; align-items: center; color: #1f1f1f; background: #f2e7d0;
        font-family: "SF Pro Text", "PingFang SC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .grid { position: absolute; inset: 0; opacity: .32; background-image: linear-gradient(to right, #a99f8f 1px, transparent 1px), linear-gradient(to bottom, #a99f8f 1px, transparent 1px); background-size: 44px 44px; }
      .content { position: relative; display: flex; width: 100%; align-items: center; gap: 20px; padding: 44px; }
      img { width: 104px; height: 104px; filter: drop-shadow(0 12px 18px rgba(32,28,23,.15)); }
      .brand { color: #6f6a62; font-size: 14px; font-weight: 650; }
      h1 { margin: 12px 0 0; font-size: 29px; line-height: 1.18; letter-spacing: 0; }
      p { margin: 10px 0 0; color: #727865; font-size: 12px; font-weight: 650; }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <div class="content">
      <img src="./logo/ncurator-logo.svg" alt="" />
      <div>
        <div class="brand">馆长: AI助手</div>
        <h1>收藏夹网址<br />一键复制</h1>
        <p>本地读取 · 不修改 · 不上传</p>
      </div>
    </div>
  </body>
</html>
