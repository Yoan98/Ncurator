<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>馆长 - 小宣传图</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 440px; height: 280px; margin: 0; overflow: hidden; }
      body {
        position: relative;
        color: #f8f7f3;
        background: #171a16;
        font-family: "SF Pro Text", "PingFang SC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .rule { position: absolute; inset: 0 auto 0 0; width: 8px; background: #4f806d; }
      .content { display: flex; height: 100%; align-items: center; gap: 24px; padding: 42px 38px 42px 46px; }
      img { width: 92px; height: 92px; flex: none; }
      .brand { color: #c6c9c1; font-size: 15px; font-weight: 650; }
      h1 { margin: 12px 0 0; font-size: 31px; line-height: 1.18; letter-spacing: 0; }
      p { margin: 13px 0 0; color: #9bbbab; font-size: 13px; font-weight: 650; }
    </style>
  </head>
  <body>
    <div class="rule"></div>
    <div class="content">
      <img src="./logo/ncurator-logo.svg" alt="" />
      <div>
        <div class="brand">馆长</div>
        <h1>你的 AI<br />工作伙伴</h1>
        <p>查资料 · 用知识库 · 写文档</p>
      </div>
    </div>
  </body>
</html>
