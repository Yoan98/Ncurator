<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>馆长: AI助手 - UI Preview</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      const messages = {
        extensionName: "馆长: AI助手",
        browserCompanion: "浏览器配套工具",
        bookmarkTitle: "你的收藏夹",
        urlUnit: "个网址",
        copyAll: "复制全部网址",
        copiedCount: "已复制 $1 个",
        copyFailed: "复制失败",
        loading: "正在读取收藏夹",
        loadFailed: "无法读取收藏夹",
        retry: "重新读取",
        emptyTitle: "还没有收藏网址",
        emptyDescription: "添加收藏夹后，它们会显示在这里。",
        privacyNote: "仅在本地读取，不修改、不保存、不上传。",
        desktopTitle: "馆长已全面升级为桌面端",
        desktopDescription: "更快、更完整，支持 macOS 和 Windows",
        learnDesktop: "了解桌面版",
      };

      globalThis.chrome = {
        i18n: {
          getMessage(key, substitutions) {
            const value = messages[key] || key;
            const replacement = Array.isArray(substitutions)
              ? substitutions[0]
              : substitutions;
            return replacement ? value.replace("$1", replacement) : value;
          },
        },
        runtime: { lastError: undefined },
        bookmarks: {
          getTree(callback) {
            callback([
              {
                id: "0",
                title: "",
                children: [
                  {
                    id: "1",
                    title: "收藏夹栏",
                    children: [
                      {
                        id: "2",
                        title: "馆长 Ncurator",
                        url: "https://www.ncurator.com/zh",
                      },
                      {
                        id: "3",
                        title: "工作资料",
                        children: [
                          {
                            id: "4",
                            title: "项目协作",
                            url: "https://github.com",
                          },
                          {
                            id: "5",
                            title: "设计文件",
                            url: "https://www.figma.com",
                          },
                        ],
                      },
                    ],
                  },
                  {
                    id: "6",
                    title: "其他收藏夹",
                    children: [
                      {
                        id: "7",
                        title: "开发者文档",
                        url: "https://developer.chrome.com/docs/extensions",
                      },
                      {
                        id: "8",
                        title: "Microsoft Edge 扩展",
                        url: "https://learn.microsoft.com/microsoft-edge/extensions-chromium",
                      },
                    ],
                  },
                ],
              },
            ]);
          },
        },
      };
    </script>
    <script type="module" src="/entrypoints/popup/main.tsx"></script>
  </body>
</html>
