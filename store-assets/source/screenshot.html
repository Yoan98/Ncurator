<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>馆长 - 产品总览</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 1280px; height: 800px; margin: 0; overflow: hidden; }
      body {
        position: relative; color: #1d201c; background: #f1f2ee;
        font-family: "SF Pro Text", "PingFang SC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .copy { position: absolute; z-index: 2; left: 64px; top: 66px; width: 455px; }
      .brand { display: flex; align-items: center; gap: 14px; color: #5d635b; font-size: 18px; font-weight: 650; }
      .brand img { width: 58px; height: 58px; }
      h1 { margin: 54px 0 0; font-size: 61px; line-height: 1.08; letter-spacing: 0; }
      p { margin: 24px 0 0; color: #565c54; font-size: 21px; line-height: 1.65; }
      .abilities { margin-top: 36px; color: #39705d; font-size: 15px; font-weight: 700; }
      .visual {
        position: absolute; left: 500px; top: 62px; width: 820px; height: 676px; overflow: hidden;
        border: 1px solid #d2d6cf; border-radius: 8px; background: white;
        box-shadow: 0 28px 70px rgba(34,42,35,.13);
      }
      .visual img { width: 1082px; height: 676px; object-fit: cover; object-position: left center; }
      .browser-note {
        position: absolute; left: 64px; bottom: 62px; display: flex; align-items: center; gap: 10px;
        color: #62685f; font-size: 14px; font-weight: 650;
      }
      .browser-note i { width: 9px; height: 9px; border-radius: 50%; background: #4f806d; }
    </style>
  </head>
  <body>
    <div class="copy">
      <div class="brand"><img src="./logo/ncurator-logo.svg" alt="" />馆长</div>
      <h1>你的 AI<br />工作伙伴</h1>
      <p>你安排任务，让馆长帮你完成。</p>
      <div class="abilities">查资料 · 用知识库 · 写文档</div>
    </div>
    <div class="visual"><img src="./media/desktop-task.png" alt="馆长桌面端执行任务" /></div>
    <div class="browser-note"><i></i>浏览器插件支持收藏夹网址一键复制</div>
  </body>
</html>
