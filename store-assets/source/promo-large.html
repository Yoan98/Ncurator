<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>馆长 - 大宣传图</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 1400px; height: 560px; margin: 0; overflow: hidden; }
      body {
        position: relative;
        color: #f8f7f3;
        background: #171a16;
        font-family: "SF Pro Text", "PingFang SC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .copy { position: absolute; z-index: 2; left: 76px; top: 58px; width: 520px; }
      .brand { display: flex; align-items: center; gap: 15px; color: #c6c9c1; font-size: 18px; font-weight: 650; }
      .brand img { width: 62px; height: 62px; }
      h1 { margin: 34px 0 0; font-size: 55px; line-height: 1.1; letter-spacing: 0; }
      p { margin: 20px 0 0; color: #bdc1b8; font-size: 20px; line-height: 1.6; }
      .abilities { margin-top: 29px; color: #9bbbab; font-size: 15px; font-weight: 650; }
      .visual {
        position: absolute; right: 0; top: 0; width: 770px; height: 560px; overflow: hidden;
        border-left: 1px solid #353a33; background: #fbfaf7;
      }
      .visual img { width: 896px; height: 560px; object-fit: cover; object-position: 25% center; }
      .browser-note {
        position: absolute; right: 40px; bottom: 34px; display: flex; align-items: center; gap: 10px;
        padding: 13px 17px; border: 1px solid #d6d8d2; border-radius: 7px; color: #30332e;
        background: rgba(251,250,247,.96); font-size: 14px; font-weight: 650;
      }
      .browser-note i { width: 8px; height: 8px; border-radius: 50%; background: #4f806d; }
    </style>
  </head>
  <body>
    <div class="copy">
      <div class="brand"><img src="./logo/ncurator-logo.svg" alt="" />馆长</div>
      <h1>你的 AI<br />工作伙伴</h1>
      <p>你安排任务，让馆长帮你完成。</p>
      <div class="abilities">查资料 · 用知识库 · 写文档</div>
    </div>
    <div class="visual">
      <img src="./media/desktop-task.png" alt="馆长桌面端执行任务" />
      <div class="browser-note"><i></i>浏览器收藏夹，一键复制网址</div>
    </div>
  </body>
</html>
