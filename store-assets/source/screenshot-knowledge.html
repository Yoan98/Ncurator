<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>馆长 - 知识库工作</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 1280px; height: 800px; margin: 0; overflow: hidden; }
      body {
        position: relative; color: #f8f7f3; background: #171a16;
        font-family: "SF Pro Text", "PingFang SC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .copy { position: absolute; z-index: 3; left: 58px; top: 58px; width: 390px; }
      .brand { display: flex; align-items: center; gap: 13px; color: #c6c9c1; font-size: 17px; font-weight: 650; }
      .brand img { width: 54px; height: 54px; }
      h1 { margin: 76px 0 0; font-size: 52px; line-height: 1.14; letter-spacing: 0; }
      p { margin: 24px 0 0; color: #bcc1b8; font-size: 19px; line-height: 1.7; }
      .point { margin-top: 34px; color: #9bbbab; font-size: 15px; font-weight: 700; }
      .visual { position: absolute; left: 460px; inset-block: 0; width: 820px; overflow: hidden; background: #fff; }
      .visual img { width: 1280px; height: 800px; object-fit: cover; object-position: 4% center; }
      .edge { position: absolute; z-index: 2; left: 460px; top: 0; bottom: 0; width: 1px; background: #343a33; }
    </style>
  </head>
  <body>
    <div class="copy">
      <div class="brand"><img src="./logo/ncurator-logo.svg" alt="" />馆长</div>
      <h1>用你的资料<br />完成真实工作</h1>
      <p>馆长会使用本地知识库，找到依据、整理信息，并生成可以继续使用的文档。</p>
      <div class="point">答案有依据 · 文件在本地</div>
    </div>
    <div class="edge"></div>
    <div class="visual"><img src="./media/desktop-knowledge.png" alt="馆长使用知识库生成文档" /></div>
  </body>
</html>
